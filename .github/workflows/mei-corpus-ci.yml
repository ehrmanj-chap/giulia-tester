name: Mei corpus validation
on:
  push:
    branches: ['main', 'mei/full-drive-corpus-20260929']
  pull_request:
    paths:
      - 'mei-backend/**'
      - 'tests/**'
      - 'public/dual-lab/**'
      - 'voice-service/**'
      - 'cloud_voice/**'
      - 'api/voice/**'
      - 'lib/voice-cloud-proxy.mjs'
      - 'server.mjs'
      - 'scripts/import-mei-corpus.py'
      - '.github/workflows/mei-corpus-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Offline tests only (no model calls)
        run: npm test
      - name: Validate browser entrypoints
        run: |
          node --check public/dual-lab/app.js
          node --check public/dual-lab/voice/app.js
          node --check public/dual-lab/voice/browser-speech.js
      - name: Validate speech gateway HTTP contract (no models)
        run: python3 voice-service/test_server.py
      - name: Validate Modal server and Vercel voice endpoints (no credentials)
        run: |
          python3 -m py_compile cloud_voice/modal_app.py
          node --check lib/voice-cloud-proxy.mjs
          node --check api/voice/v1/status.js
          node --check api/voice/v1/tts.js
          node --check api/voice/v1/stt.js
      - name: Export tracked source for local import verification
        if: matrix.node == '24'
        run: git archive --format=tar.gz --output=/tmp/mei-base-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: mei-base-source
          path: /tmp/mei-base-source.tar.gz
          retention-days: 1
