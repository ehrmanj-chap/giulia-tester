<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giulia Local Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header><div class="wrap"><div class="eyebrow">PRIVATE LOCAL LAB</div><h1>Giulia</h1><p>Unified Cultural + Business prototype. One visible Giulia, internal routing diagnostics enabled.</p></div></header>
  <main class="wrap">
    <section class="status-card"><div><strong id="providerStatus">Checking local backend…</strong><div id="modelStatus" class="muted"></div></div><div class="toolbar"><span id="routeBadge" class="badge hidden">route</span><button id="downloadTrace" class="ghost" type="button">Download latest trace</button><button id="reset" class="ghost" type="button">Reset</button></div></section>
    <section class="chat-card"><div id="messages" class="messages" aria-live="polite"><div class="system-note">Local developer build. Prompts and KB are placeholders until the lab corpus is added.</div></div><form id="chatForm" class="composer"><textarea id="input" rows="3" placeholder="Ask Giulia about Italian culture or business…" autofocus></textarea><button id="send" type="submit">Send</button></form></section>
    <details class="diagnostics-card"><summary>Forensic diagnostics</summary><pre id="diagnostics">No run yet.</pre></details>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
